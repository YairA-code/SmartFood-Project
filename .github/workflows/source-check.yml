# בדיקה יומית, בשעות ששופרסל מתירה ב-robots.txt (04:00-08:45 UTC, דף כל 10 שניות):
# 1. check: האם רשימות הרכיבים של המוצרים שנבדקו השתנו, והאם נמצאו ברקודים חדשים.
#    לא משנה את האתר: פותח או מעדכן issue אחד.
# 2. collect: אחרי הבדיקה, אוסף רשימות רכיבים משופרסל למאגר המורחב (data/catalog)
#    ושומר אותן לאתר. הניתוח של המוצרים האלה אוטומטי ומסומן ככזה באתר.
name: Daily source check

on:
  # GitHub מעכב ריצות מתוזמנות לפעמים בשעות, ולפעמים מדלג עליהן. לכן הזרימה מתחילה כל
  # חצי שעה סביב השעון, ושלב השער (gate) מחליט: מחוץ לחלון של שופרסל הריצה נגמרת תוך
  # שניות בלי לפנות לשופרסל. בתוך החלון האיסוף ממשיך מאיפה שעצר, והבדיקה רצה פעם ביום.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-check
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      in_window: ${{ steps.g.outputs.in_window }}
      run_check: ${{ steps.g.outputs.run_check }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          now=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          # 04:00-08:20 UTC: מספיק זמן לעבודה לפני שהחלון נסגר ב-08:40
          if [ $now -ge 240 ] && [ $now -lt 500 ]; then in=true; else in=false; fi
          checked=no
          for id in $(gh run list --workflow source-check.yml --created ">=$(date -u +%F)" --status success --json databaseId --jq '.[].databaseId'); do
            if gh run view "$id" --json jobs --jq '.jobs[] | select(.name=="check" and .conclusion=="success") | .name' | grep -q check; then checked=yes; break; fi
          done
          run_check=false
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$in" = true ] && [ "$checked" = no ]; }; then run_check=true; fi
          echo "in_window=$in" >> "$GITHUB_OUTPUT"
          echo "run_check=$run_check" >> "$GITHUB_OUTPUT"
          echo "in_window=$in checked_today=$checked run_check=$run_check"

  check:
    needs: gate
    if: ${{ needs.gate.outputs.run_check == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dump products
        run: node .github/scripts/dump.mjs > /tmp/products.json
      - name: Check sources
        run: python3 .github/scripts/source_check.py /tmp/products.json /tmp/report.md
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat /tmp/report.md.status)" != "findings" ]; then echo "nothing to report"; exit 0; fi
          gh label create source-check --color 0E8A16 --description "בדיקת מקורות יומית" 2>/dev/null || true
          num=$(gh issue list --label source-check --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body-file /tmp/report.md
          else gh issue create --title "בדיקת מקורות יומית: יש מוצרים לבדיקה" --label source-check --body-file /tmp/report.md; fi

  collect:
    needs: [gate, check]
    if: ${{ always() && needs.gate.result == 'success' && (needs.gate.outputs.in_window == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 280
    # הסוד שמור בסביבה catalog-bot, שמותרת רק לענף main: קוד מכל ענף אחר לא יכול לגשת אליו
    environment: catalog-bot
    permissions:
      contents: read
    outputs:
      added: ${{ steps.collect.outputs.added }}
      queue: ${{ steps.collect.outputs.queue }}
      window: ${{ steps.collect.outputs.window }}
      with_ingredients: ${{ steps.collect.outputs.with_ingredients }}
    steps:
      # שמירה דרך מפתח פריסה (deploy key) שרשום ברשימת החריגים של חוק ההגנה.
      # המפתח הפרטי שמור כסוד CATALOG_DEPLOY_KEY, שרק בעל המאגר יכול לראות או לשנות.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
      - name: Collect ingredient lists from Shufersal Online
        id: collect
        run: python3 .github/scripts/collect_shufersal.py data/catalog
      - name: Save to the site
        run: |
          if git diff --quiet -- data/catalog; then echo "no changes"; exit 0; fi
          git config user.name "smartfood-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog
          git commit -m "מאגר מורחב: רשימות רכיבים משופרסל אונליין ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done

  # בקרה: אם הבדיקה או האיסוף נכשלו, או שהאיסוף רץ בחלון ולא הוסיף כלום,
  # נפתח (או מתעדכן) issue עם התווית daily-health, ו-GitHub שולח מייל לבעל המאגר.
  health:
    needs: [gate, check, collect]
    if: ${{ always() && (needs.gate.outputs.in_window == 'true' || github.event_name == 'workflow_dispatch' || needs.gate.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report problems
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GATE: ${{ needs.gate.result }}
          CHECK: ${{ needs.check.result }}
          COLLECT: ${{ needs.collect.result }}
          ADDED: ${{ needs.collect.outputs.added }}
          QUEUE: ${{ needs.collect.outputs.queue }}
          WINDOW: ${{ needs.collect.outputs.window }}
          TOTAL: ${{ needs.collect.outputs.with_ingredients }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          problem=""
          [ "$GATE" != "success" ] && problem="$problem\n- שלב השער הסתיים במצב: $GATE"
          [ "$CHECK" != "success" ] && [ "$CHECK" != "skipped" ] && problem="$problem\n- הבדיקה היומית הסתיימה במצב: $CHECK"
          [ "$COLLECT" != "success" ] && [ "$COLLECT" != "skipped" ] && problem="$problem\n- האיסוף משופרסל הסתיים במצב: $COLLECT"
          if [ "$COLLECT" = "success" ] && [ "$WINDOW" = "yes" ] && [ "${ADDED:-0}" = "0" ] && [ "${QUEUE:-0}" != "0" ]; then
            problem="$problem\n- האיסוף רץ בשעות המותרות אבל לא הוסיף אף רשימת רכיבים (בתור: $QUEUE). ייתכן שמבנה הדף בשופרסל השתנה."
          fi
          if [ -z "$problem" ]; then echo "healthy: added=$ADDED total=$TOTAL window=$WINDOW"; exit 0; fi
          body=$(printf "## בעיה בריצה היומית %s\n%b\n\nפרטים: %s" "$(date -u +%Y-%m-%d)" "$problem" "$RUN_URL")
          gh label create daily-health --color D93F0B --description "תקלה בריצה היומית" 2>/dev/null || true
          num=$(gh issue list --label daily-health --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"
          else gh issue create --title "תקלה בריצה היומית של האתר" --label daily-health --body "$body"; fi

